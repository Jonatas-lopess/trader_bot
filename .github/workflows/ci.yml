name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

# No deploy job: deployment is blocked on an external prerequisite (a
# registered domain on a Cloudflare zone, PLANNING.md §12) that does not
# exist yet. This workflow builds; it does not ship.
