name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy (workers.dev test route)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    # workers.dev only — PLANNING.md §12's custom-domain prerequisite still
    # gates production, so this is the test-phase route, not a go-live
    # deploy. Requires database_id/bucket_name in wrangler.jsonc to be swapped
    # from their placeholders (`wrangler d1 create` / `wrangler r2 bucket
    # create` against the target account) before this job can succeed.
    #
    # `environment: dev` is required for GitHub Actions to expose secrets
    # stored on the "dev" Environment (Settings → Environments) to this job —
    # a job with no `environment:` key only sees repository-level secrets,
    # never Environment-scoped ones, regardless of what's configured there.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply trader-bot-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # PAYMENT_PROVIDER is injected here, not in wrangler.jsonc: baking it
          # into the checked-in config also feeds the test/build job above,
          # which mocks only Appmax and expects factory.ts's fail-closed
          # default (.scratch/checkout-webhooks/issues/09-revert-payment-provider-before-golive.md).
          # This workers.dev test route is the only deploy target that should
          # opt into the Stripe test driver (ADR-0005) — a go-live deploy to
          # the real production domain must not carry this flag.
          #
          # The var name/value live in the "dev" GitHub Environment's
          # variables (Settings → Environments → dev → Variables), not as a
          # literal here, so a future production deploy job — even if it
          # copies this step wholesale onto a different Environment — won't
          # inherit it: `vars.PAYMENT_PROVIDER` only resolves on Environments
          # where it's explicitly set.
          command: deploy${{ vars.PAYMENT_PROVIDER && format(' --var PAYMENT_PROVIDER:{0}', vars.PAYMENT_PROVIDER) || '' }}
